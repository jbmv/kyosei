name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a failure which needs no commit (a date passing, a dependency's new
  # release, a runner image change) is found without waiting for the next push.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A tmux client refuses to start without a usable TERM, and the runner sets none.
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      # Without tmux, the orchestrator-session tests skip themselves.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # The tests commit in temporary repositories and expect a person's usual git settings.
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Lint
        run: make lint
      - name: Test
        # A lint failure should not hide the suite's result.
        if: success() || failure()
        run: make test
