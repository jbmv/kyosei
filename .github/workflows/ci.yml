name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a failure which needs no commit (a date passing, a dependency's new
  # release, a runner image change) is found without waiting for the next push.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      # Without tmux, the orchestrator-session tests skip themselves.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Lint
        run: make lint
      - name: Test
        run: make test
