<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A transcript can quote anything, so the page loads only its own files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; font-src file:; img-src data:"
    />
    <link rel="stylesheet" href="katex.min.css" />
    <link rel="stylesheet" href="hljs-light.css" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="hljs-dark.css" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <header id="top"><span id="top-title"></span></header>

    <nav id="menu">
      <div id="menu-panel">
        <h4>Sessions</h4>
        <div id="sessions"></div>
        <div id="sessions-more" class="session" hidden></div>
        <div id="side">
          <section>
            <h4>Subagents</h4>
            <div id="side-agents"></div>
            <div id="side-agents-finished" class="finished clickable"></div>
            <div id="side-agents-done"></div>
          </section>
          <section>
            <h4>Background tasks</h4>
            <div id="side-tasks"></div>
            <div id="side-finished" class="clickable"></div>
            <div id="side-tasks-done"></div>
          </section>
        </div>
      </div>
      <div id="menu-icon" aria-hidden="true">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor">
          <rect x="0.5" y="0.5" width="17" height="13" rx="2.5" />
          <line x1="5.5" y1="4" x2="5.5" y2="10" />
        </svg>
      </div>
    </nav>

    <button id="terminal-toggle" aria-label="Show or hide the terminal">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor">
        <rect x="0.5" y="0.5" width="15" height="13" rx="2.5" />
        <polyline points="4,4 7,7 4,10" />
        <line x1="8.5" y1="10" x2="12" y2="10" />
      </svg>
    </button>

    <pre id="terminal"></pre>

    <div id="page">
      <main>
        <div id="chat"></div>
        <article id="live" class="reply"></article>
        <div id="working" hidden><span class="pulse"></span><span id="working-text"></span></div>
      </main>
    </div>
    <script src="chat.js"></script>
  </body>
</html>
