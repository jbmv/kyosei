<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A transcript can quote anything, so the page loads only its own files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; font-src file:; img-src data:"
    />
    <link rel="stylesheet" href="katex.min.css" />
    <link rel="stylesheet" href="hljs-light.css" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="hljs-dark.css" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <!-- The bar above the top bar (KYO-761): the dropdown of the server's projects, a link
         for each project with a live orchestrator session, a divider, and the views, each
         of which replaces the pane below. chat.ts fills the lists. -->
    <nav id="views">
      <div id="project-switch">
        <button id="project-button" aria-haspopup="listbox" aria-expanded="false" title="Switch project">
          <span id="project-name"></span>
          <svg width="9" height="6" viewBox="0 0 9 6" fill="none" stroke="currentColor" aria-hidden="true"><path d="M1 1l3.5 3.5L8 1" /></svg>
        </button>
        <div id="project-popup" class="project-rows" role="listbox" aria-label="Projects" hidden></div>
      </div>
      <div id="session-links"></div>
      <span id="views-divider" aria-hidden="true"></span>
      <div id="view-items"></div>
    </nav>

    <!-- Shown in place of everything under the bar while the window has no project: on a
         first run, and when the project last shown is no longer served (KYO-761). -->
    <section id="projects-pane">
      <div class="projects-inner">
        <h2>Projects</h2>
        <p>Choose the project this window shows.</p>
        <div id="projects-list" class="project-rows" role="listbox" aria-label="Projects"></div>
      </div>
    </section>

    <!-- An element with data-view is shown only while that view is the current one. -->
    <header id="top">
      <span class="top-part" data-view="chat"><span id="top-title"></span><span id="top-activity"></span>
      <!-- Search in the chat (KYO-741): opened by Command-F, closed by Escape. -->
      <span id="find" hidden>
        <input id="find-field" class="records-search" type="search" placeholder="Search this chat" aria-label="Search this chat" />
        <span id="find-count"></span>
        <button id="find-prev" class="nav-icon" data-nav-icon="up" title="Previous (Shift-Return)" aria-label="Previous hit"></button>
        <button id="find-next" class="nav-icon" data-nav-icon="down" title="Next (Return)" aria-label="Next hit"></button>
      </span></span>
      <span class="top-part" data-view="records" hidden>
        <span class="nav-icons" data-nav="records">
          <button id="records-home" class="nav-icon" data-nav-icon="home" title="Home" aria-label="Home"></button>
          <button id="records-back" class="nav-icon" data-nav-icon="back" title="Back" aria-label="Back"></button>
          <button id="records-forward" class="nav-icon" data-nav-icon="forward" title="Forward" aria-label="Forward"></button>
        </span>
        <span id="records-count"></span>
      </span>
      <span class="top-part" data-view="files" hidden>
        <span class="nav-icons" data-nav="files">
          <button id="files-home" class="nav-icon" data-nav-icon="home" title="Home" aria-label="Home"></button>
          <button id="files-back" class="nav-icon" data-nav-icon="back" title="Back" aria-label="Back"></button>
          <button id="files-forward" class="nav-icon" data-nav-icon="forward" title="Forward" aria-label="Forward"></button>
        </span>
        <span id="files-path"></span>
        <span id="files-meta"></span>
      </span>
    </header>

    <nav id="menu">
      <div id="menu-panel">
        <div id="records-side" data-view="records" hidden>
          <input class="records-search" type="search" placeholder="Search records" aria-label="Search records" />
          <div class="records-filters">
            <button class="chip" data-filter="open" aria-pressed="false">Open</button>
            <button class="chip" data-filter="dispatchable" aria-pressed="false">Dispatchable</button>
            <button class="chip" data-filter="awaiting" aria-pressed="false">Awaiting you</button>
          </div>
          <div id="records-list"></div>
          <h4>History</h4>
          <div id="records-history"></div>
        </div>
        <!-- Files (KYO-736): a chip for each root the server serves, the chosen root's tree,
             and the files the session's replies and prompts have named. -->
        <div id="files-side" data-view="files" hidden>
          <div class="files-bar">
            <div class="files-roots"></div>
            <button class="files-dots text-button" aria-pressed="false">Show dotfiles</button>
          </div>
          <div class="files-tree"></div>
          <h4>Mentioned in this session</h4>
          <div id="files-mentioned"></div>
        </div>
        <div data-view="chat">
        <h4>Sessions</h4>
        <div id="sessions"></div>
        <div id="sessions-more" class="session" hidden></div>
        <div id="side">
          <section>
            <h4>Subagents</h4>
            <div id="side-agents"></div>
            <div id="side-agents-finished" class="finished clickable"></div>
            <div id="side-agents-done"></div>
          </section>
          <section>
            <h4>Background tasks</h4>
            <div id="side-tasks"></div>
            <div id="side-finished" class="clickable"></div>
            <div id="side-tasks-done"></div>
          </section>
          <section>
            <h4>Files mentioned</h4>
            <div id="side-mentioned"></div>
            <div id="side-mentioned-more" class="clickable" hidden></div>
          </section>
        </div>
        </div>
      </div>
      <div id="menu-icon" aria-hidden="true">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor">
          <rect x="0.5" y="0.5" width="17" height="13" rx="2.5" />
          <line x1="5.5" y1="4" x2="5.5" y2="10" />
        </svg>
      </div>
    </nav>

    <button id="terminal-toggle" aria-label="Show or hide the terminal">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor">
        <rect x="0.5" y="0.5" width="15" height="13" rx="2.5" />
        <polyline points="4,4 7,7 4,10" />
        <line x1="8.5" y1="10" x2="12" y2="10" />
      </svg>
    </button>

    <div id="terminal">
      <div id="terminal-note" hidden></div>
      <div id="terminal-screen"></div>
      <pre id="terminal-text" hidden></pre>
    </div>

    <div id="band"></div>
    <aside id="composer">
      <div id="composer-top">
        <button id="new-prompt" title="New prompt" aria-label="New prompt">+</button>
        <button id="interrupt" hidden>Interrupt</button>
      </div>
      <div id="boxes"></div>
      <div id="held" hidden>
        <span id="held-text"></span>
        <button id="held-send-now" hidden title="Send it now; the agent takes it at its next tool call">Send now</button>
        <button id="held-edit">Edit</button>
      </div>
      <div id="composer-actions">
        <span id="composer-note"></span>
      </div>
    </aside>

    <button id="jump-bottom" title="Jump to the end" aria-label="Jump to the end"><svg viewBox="0 0 24 24" class="icon"><path d="M12 5v13M6 12.5l6 6 6-6"/></svg></button>
    <div id="page">
      <main>
        <div id="chat"></div>
        <article id="live" class="reply"></article>
        <div id="working" hidden><span class="pulse"></span><span id="working-text"></span></div>
        <div id="start" hidden>
          <span id="start-text"></span>
          <button id="start-button">Start orchestrator</button>
        </div>
      </main>
    </div>
    <section id="view-records" class="view-pane" data-view="records" hidden>
      <div class="records-inner">
        <div id="records-note" hidden></div>
        <div id="records-landing">
          <div class="records-tools">
            <input class="records-search" type="search" placeholder="Search records" aria-label="Search records" />
            <div class="records-filters">
              <button class="chip" data-filter="open" aria-pressed="false">Open</button>
              <button class="chip" data-filter="dispatchable" aria-pressed="false">Dispatchable</button>
            <button class="chip" data-filter="awaiting" aria-pressed="false">Awaiting you</button>
            </div>
          </div>
          <div id="records-groups"></div>
        </div>
        <article id="record" hidden></article>
      </div>
    </section>
    <section id="view-files" class="view-pane" data-view="files" hidden>
      <div class="files-inner">
        <div id="files-note" hidden></div>
        <div id="files-landing">
          <div class="files-bar">
            <div class="files-roots"></div>
            <button class="files-dots text-button" aria-pressed="false">Show dotfiles</button>
          </div>
          <div class="files-tree"></div>
        </div>
        <article id="file" hidden></article>
      </div>
    </section>
    <script src="chat.js"></script>
  </body>
</html>
