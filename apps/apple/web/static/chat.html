<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A transcript can quote anything, so the page loads only its own files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; font-src file:; img-src data:"
    />
    <link rel="stylesheet" href="katex.min.css" />
    <link rel="stylesheet" href="hljs-light.css" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="hljs-dark.css" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <!-- The views, each of which replaces the pane below; chat.ts fills this from its list. -->
    <nav id="views"></nav>

    <!-- An element with data-view is shown only while that view is the current one. -->
    <header id="top">
      <span class="top-part" data-view="chat"><span id="top-title"></span><span id="top-activity"></span></span>
      <span class="top-part" data-view="records" hidden>
        <button id="records-home" hidden>All records</button>
        <span id="records-count"></span>
      </span>
    </header>

    <nav id="menu">
      <div id="menu-panel">
        <div id="records-side" data-view="records" hidden>
          <input class="records-search" type="search" placeholder="Search records" aria-label="Search records" />
          <div class="records-filters">
            <button class="chip" data-filter="open" aria-pressed="false">Open</button>
            <button class="chip" data-filter="dispatchable" aria-pressed="false">Dispatchable</button>
            <button class="chip" data-filter="awaiting" aria-pressed="false">Awaiting you</button>
          </div>
          <div id="records-list"></div>
          <h4>History</h4>
          <div id="records-history"></div>
        </div>
        <div data-view="chat">
        <h4>Sessions</h4>
        <div id="sessions"></div>
        <div id="sessions-more" class="session" hidden></div>
        <div id="side">
          <section>
            <h4>Subagents</h4>
            <div id="side-agents"></div>
            <div id="side-agents-finished" class="finished clickable"></div>
            <div id="side-agents-done"></div>
          </section>
          <section>
            <h4>Background tasks</h4>
            <div id="side-tasks"></div>
            <div id="side-finished" class="clickable"></div>
            <div id="side-tasks-done"></div>
          </section>
        </div>
        </div>
      </div>
      <div id="menu-icon" aria-hidden="true">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor">
          <rect x="0.5" y="0.5" width="17" height="13" rx="2.5" />
          <line x1="5.5" y1="4" x2="5.5" y2="10" />
        </svg>
      </div>
    </nav>

    <button id="terminal-toggle" aria-label="Show or hide the terminal">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor">
        <rect x="0.5" y="0.5" width="15" height="13" rx="2.5" />
        <polyline points="4,4 7,7 4,10" />
        <line x1="8.5" y1="10" x2="12" y2="10" />
      </svg>
    </button>

    <div id="terminal">
      <div id="terminal-note" hidden></div>
      <div id="terminal-screen"></div>
      <pre id="terminal-text" hidden></pre>
    </div>

    <div id="band"></div>
    <aside id="composer">
      <div id="composer-top">
        <button id="new-prompt" title="New prompt" aria-label="New prompt">+</button>
        <button id="interrupt" hidden>Interrupt</button>
      </div>
      <div id="boxes"></div>
      <div id="held" hidden>
        <span id="held-text"></span>
        <button id="held-send-now" hidden title="Send it now; the agent takes it at its next tool call">Send now</button>
        <button id="held-edit">Edit</button>
      </div>
      <div id="composer-actions">
        <span id="composer-note"></span>
      </div>
    </aside>

    <div id="page">
      <main>
        <div id="chat"></div>
        <article id="live" class="reply"></article>
        <div id="working" hidden><span class="pulse"></span><span id="working-text"></span></div>
        <div id="start" hidden>
          <span id="start-text"></span>
          <button id="start-button">Start orchestrator</button>
        </div>
      </main>
    </div>
    <section id="view-records" class="view-pane" data-view="records" hidden>
      <div class="records-inner">
        <div id="records-note" hidden></div>
        <div id="records-landing">
          <div class="records-tools">
            <input class="records-search" type="search" placeholder="Search records" aria-label="Search records" />
            <div class="records-filters">
              <button class="chip" data-filter="open" aria-pressed="false">Open</button>
              <button class="chip" data-filter="dispatchable" aria-pressed="false">Dispatchable</button>
            <button class="chip" data-filter="awaiting" aria-pressed="false">Awaiting you</button>
            </div>
          </div>
          <div id="records-groups"></div>
        </div>
        <article id="record" hidden></article>
      </div>
    </section>
    <script src="chat.js"></script>
  </body>
</html>
